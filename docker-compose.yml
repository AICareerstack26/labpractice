services:
  langfuse-db:
    image: postgres:16
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: langfuse }
    volumes: [ langfuse_pgdata:/var/lib/postgresql/data ]
  langfuse:
    image: langfuse/langfuse:2
    depends_on: [ langfuse-db ]
    ports: [ "3000:3000" ]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@langfuse-db:5432/langfuse
      NEXTAUTH_SECRET: change-me-please
      SALT: change-me-please
      NEXTAUTH_URL: http://localhost:3000
      TELEMETRY_ENABLED: "false"
  qdrant:
    image: qdrant/qdrant:latest
    ports: [ "6333:6333" ]
    volumes: [ qdrant_data:/qdrant/storage ]
  redis:
    image: redis/redis-stack:latest
    ports: [ "6379:6379", "8001:8001" ]
  phoenix:
    image: arizephoenix/phoenix:latest
    ports: [ "6006:6006" ]
volumes:
  langfuse_pgdata: {}
  qdrant_data: {}
